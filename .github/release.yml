# Sections of the notes `gh release create --generate-notes` writes (release.yml's workflow), by PR label.
changelog:
  exclude:
    authors: [dependabot]
  categories:
    - title: Bug fixes
      labels: [bug]
    - title: Features
      labels: [enhancement]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
