name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test (stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Neovim
        run: |
          brew install neovim
          nvim --version
          nvim --headless -u NONE '+lua if vim.fn.has("nvim-0.12") == 0 then vim.cmd("cquit 1") end' +qa || {
            echo "::error::Neovim 0.12 or newer is required"
            exit 1
          }
      - name: Install tmux
        run: |
          brew install tmux
          tmux -V
      - name: Install zellij
        run: |
          scripts/install-zellij.sh "$HOME/zellij"
          echo "$HOME/zellij" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-latest
    env:
      # Neovim's release tarball: apt's Neovim is too old
      NVIM_VERSION: v0.12.6
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Neovim
        run: |
          curl -fsSL --retry 3 -o nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          mkdir -p "$HOME/nvim"
          tar -xzf nvim.tar.gz -C "$HOME/nvim" --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/nvim/bin:$PATH"
          nvim --version
          nvim --headless -u NONE '+lua if vim.fn.has("nvim-0.12") == 0 then vim.cmd("cquit 1") end' +qa || {
            echo "::error::Neovim 0.12 or newer is required"
            exit 1
          }
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - name: Install zellij
        run: |
          scripts/install-zellij.sh "$HOME/zellij"
          echo "$HOME/zellij" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  msrv:
    name: test (MSRV 1.88)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the version in step with rust-version in Cargo.toml
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Neovim and tmux
        run: brew install neovim tmux
      - name: Install zellij
        run: |
          scripts/install-zellij.sh "$HOME/zellij"
          echo "$HOME/zellij" >> "$GITHUB_PATH"
      - run: cargo check --all-targets
      - run: cargo test
