name: release-please

# Every push to main updates the release PR: the next version, from the Conventional Commits since the last release, in
# Cargo.toml, Cargo.lock and CHANGELOG.md. Merging it tags the version and makes its GitHub release, a draft, then calls
# release.yml, which uploads the archives, publishes the release and publishes the crate. release.yml is called here,
# not started by the tag, so it runs once whoever made the tag.
#
# release-please acts as the GitHub App whose client id and private key are the RELEASE_APP_* secrets: a PR opened with
# GITHUB_TOKEN starts no workflow, and main's ruleset merges no PR without its CI checks.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Forks have no business releasing.
    if: github.repository_owner == 'spiritledsoftware'
    runs-on: ubuntu-latest
    # The app's token does the writing; GITHUB_TOKEN needs nothing.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # This repository only, with only what release-please needs, whatever else the app may do.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write # the "autorelease: pending" labels
          permission-pull-requests: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
