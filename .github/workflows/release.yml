name: Release

# release-please.yml calls this with the tag of the release it just made, a
# draft: it builds each target's archive at that tag, checks install.sh
# installs it, uploads the archives to the release and publishes it, then
# publishes the crate. Dispatch it with a tag to finish a release whose run
# failed. A pull request that touches the release only builds and checks.
on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag, such as v0.2.0
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of a release release-please made, such as v0.2.0
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - Cargo.toml
      - Cargo.lock
      - release-please-config.json

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          # musl, linked statically, for any Linux whatever its glibc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag's commit; a pull request's own (inputs.tag is empty).
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - name: Check the tag is the crate's version
        if: inputs.tag != ''
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG isn't v$version, Cargo.toml's version"
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          archive="neopane-${{ matrix.target }}.tar.gz"
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/neopane" LICENSE README.md stage/
          tar -czf "dist/$archive" -C stage neopane LICENSE README.md
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          cat "dist/$archive.sha256"
      - name: Install with install.sh, and run it
        run: |
          NEOPANE_BASE_URL="file://$PWD/dist" NEOPANE_INSTALL_DIR="$RUNNER_TEMP/bin" bash install.sh
          "$RUNNER_TEMP/bin/neopane" --version
          "$RUNNER_TEMP/bin/npane" --help >/dev/null
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          "$RUNNER_TEMP/bin/neopane" --version | grep -q "^neopane $version "
      - name: Linked statically
        if: contains(matrix.target, 'musl')
        run: |
          file "target/${{ matrix.target }}/release/neopane"
          file "target/${{ matrix.target }}/release/neopane" | grep -q 'static'
      - uses: actions/upload-artifact@v4
        with:
          name: neopane-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # install.sh from the tag, as the archives are
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: neopane-*
          path: dist
          merge-multiple: true
      # The draft release-please made, with its changelog as the notes. Publishing it last means `releases/latest`,
      # which install.sh downloads from, never names a release without its archives.
      - name: Upload the archives and publish the release
        run: |
          cp install.sh dist/
          (cd dist && cat neopane-*.tar.gz.sha256 > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --title "neopane $TAG" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}

  crate:
    if: inputs.tag != ''
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no CARGO_REGISTRY_TOKEN secret: the crate isn't published"
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          # A rerun after the crate went up has nothing left to do
          if curl -fsS -A "neopane release ($GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/neopane/$version" >/dev/null 2>&1; then
            echo "neopane $version is already on crates.io"
            exit 0
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
