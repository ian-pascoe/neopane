name: Release

# A v* tag builds each target's archive, checks install.sh installs it,
# makes the GitHub release, and publishes the crate. A pull request that
# touches the release only builds and checks.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          # musl, linked statically, for any Linux whatever its glibc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - name: Check the tag is the crate's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME isn't v$version, Cargo.toml's version"
            exit 1
          fi
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          archive="neopane-${{ matrix.target }}.tar.gz"
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/neopane" LICENSE README.md stage/
          tar -czf "dist/$archive" -C stage neopane LICENSE README.md
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          cat "dist/$archive.sha256"
      - name: Install with install.sh, and run it
        run: |
          NEOPANE_BASE_URL="file://$PWD/dist" NEOPANE_INSTALL_DIR="$RUNNER_TEMP/bin" bash install.sh
          "$RUNNER_TEMP/bin/neopane" --version
          "$RUNNER_TEMP/bin/npane" --help >/dev/null
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          "$RUNNER_TEMP/bin/neopane" --version | grep -q "^neopane $version "
      - name: Linked statically
        if: contains(matrix.target, 'musl')
        run: |
          file "target/${{ matrix.target }}/release/neopane"
          file "target/${{ matrix.target }}/release/neopane" | grep -q 'static'
      - uses: actions/upload-artifact@v4
        with:
          name: neopane-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: neopane-*
          path: dist
          merge-multiple: true
      - name: Make the GitHub release
        run: |
          cp install.sh dist/
          (cd dist && cat neopane-*.tar.gz.sha256 > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "neopane $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  crate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::no CARGO_REGISTRY_TOKEN secret: the crate isn't published"
            exit 0
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
