name: Feature request
description: Something neopane should do, or support.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behaviour, command, option or config you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you've tried, or how other tools handle it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - A pane provider (Rex, tmux, zellij, herdr, Herdr app)
        - A new pane provider
        - Config
        - CLI
        - Drawing in a plain terminal
        - Neovim behaviour
        - Install and packaging
        - Documentation
        - Not sure

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
