[package]
name = "neorex"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A Rex-native Neovim frontend"
publish = false

[dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
sha1_smol = "1"
base64 = "0.22"
indexmap = "2"
# Ghostty's terminal emulator, for the golden tests only. Its build needs Zig
# 0.17 and the Ghostty source at the commit build.zig.zon pins: run them with
# scripts/golden.sh, which fetches it and sets GHOSTTY_SOURCE_DIR.
ghostty-vt = { version = "=0.8.0", optional = true, default-features = false }

[features]
golden = ["dep:ghostty-vt"]

[[test]]
name = "golden"
required-features = ["golden"]

[profile.release]
# like Zig's ReleaseSafe: integer overflow is caught
overflow-checks = true
